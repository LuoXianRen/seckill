# 开发环境配置：MySQL / Redis / RabbitMQ 连接信息
# 如本机账号密码不同，请按需修改；也可以使用 deploy/docker-compose.yml 一键启动依赖中间件。
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 兼容 MySQL 5.7 / 8.x；useSSL=false 避免本地证书问题，serverTimezone 指定时区
    url: jdbc:mysql://localhost:3306/seckill?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  redis:
    host: localhost
    port: 6379
    database: 0
    password:
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 2
        max-wait: 3000ms

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 20
        retry:
          enabled: true
          max-attempts: 3
